<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Horizontal Page Turner</title>
  <link rel="stylesheet" href="style2.css" />
</head>
<body>



<div class="viewport">
  <div class="pages">
    <section class="page">안녕, I'm So Hee</section>
    <section class="page">Skills</section>
    <section class="page">Projects</section>
    <section class="page">Education makes perfect</section>
    <section class="page">Certificates</section>
    <section class="page">Let's Talk</section>
    <section class="page">Page 7</section>
    <section class="page">Page 8</section>
    <section class="page">Page 9</section>
    <section class="page">Page 10</section>
  </div>
</div>

<div class="index">
  <!-- Clickable page numbers -->
  <button data-page="0">1</button>
  <button data-page="1">2</button>
  <button data-page="2">3</button>
  <button data-page="3">4</button>
  <button data-page="4">5</button>
  <button data-page="5">6</button>
  <button data-page="6">7</button>
  <button data-page="7">8</button>
  <button data-page="8">9</button>
  <button data-page="9">10</button>
</div>

<script src="./script2.js"></script>
</body>
</html>
